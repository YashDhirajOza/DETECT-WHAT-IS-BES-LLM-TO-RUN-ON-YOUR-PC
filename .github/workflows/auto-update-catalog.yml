name: Auto-Update LLM Catalog

on:
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install huggingface-hub

      - name: Run Update Pipeline
        run: python update_catalog.py
        
      - name: Check for Changelog
        id: check_changelog
        run: |
          if [ -f "changelog.md" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "changelog<<$EOF" >> $GITHUB_OUTPUT
            cat changelog.md >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT # <--- ADD THIS LINE
            echo "$EOF" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changelog.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(catalog): sync latest text-generation models"
          title: "🤖 Auto-Update: Catalog Metadata Refreshed"
          body: |
            This PR was automatically generated by the metadata-driven update pipeline.
            
            ${{ steps.check_changelog.outputs.changelog }}
            
            *Metrics reflect Hugging Face API data at the time of execution.*
          branch: auto-update-llm-catalog
          delete-branch: true
          labels: automated-pr
