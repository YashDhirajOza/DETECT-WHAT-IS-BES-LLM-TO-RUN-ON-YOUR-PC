name: Auto-Update LLM Catalog

on:
  schedule:
    # Runs at 08:00 UTC every Tuesday
    - cron: '0 8 * * 2'
  workflow_dispatch: # Allows you to trigger it manually via a button in the UI

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    
    # Required permissions to allow the action to create a Pull Request
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface-hub

      - name: Run Update Script
        run: python update_catalog.py
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update local LLM catalog examples"
          title: "🤖 Auto-Update: Fresh Local LLM Models Available"
          body: |
            This PR was auto-generated by the `update_catalog.py` script. 
            
            It scanned the Hugging Face API for trending GGUF models from trusted authors and updated the recommended examples in `catalog.json`.
            
            Please review the changes to ensure the models look sound before merging.
          branch: auto-update-llm-catalog
          delete-branch: true
          labels: automated-pr
